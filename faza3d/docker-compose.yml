# FAZA 3D — plateforme + site client + tunnel Cloudflare, en 3 conteneurs
# Démarrer :  docker compose up -d      Mettre à jour :  docker compose up -d --build
services:
  atelier:
    build: .
    container_name: faza3d-atelier
    restart: unless-stopped
    volumes:
      - ./donnees:/app/donnees            # base de données, fichiers, sauvegardes, secrets (à sauvegarder)
      - ./config.json:/app/config.json:ro # réglages (port, imprimantes)
    # aucun port publié sur la machine : seul le tunnel y accède
    expose: ["8787"]

  site:
    image: nginx:1.27-alpine
    container_name: faza3d-site
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro   # index.html du site client
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: faza3d-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}     # jeton du tunnel, dans le fichier .env
    depends_on: [atelier, site]
